<div style="text-align: center">
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
</div>
<p id="output"></p>
<script>
  var Module = {
    arguments: (function(){
      let args = window.location.search.substring(1).trim().split('&');
      let result = [];
      for (let i = 0; i < args.length; ++i) {
        let param = args[i].split(/=(.*)/s)
        if(param[0].length > 1)
          result.push('--' + param[0]);
        else if(param[0].length === 1)
          result.push('-' + param[0]);
        if(param.length > 1)
          result.push(decodeURIComponent(param[1]));
      }
      console.log('ARGUMENTS: '+result.join(' '));
      return result;
    })(),
    print: (function() {
      let element = document.getElementById('output');
      if (element) element.value = ''; // clear browser cache
      return function(text) {
        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
        console.log(text);
        if (element) {
          element.value += text + "\n";
          element.scrollTop = element.scrollHeight; // focus on bottom
        }
      };
    })(),
    canvas: (function() {
      let canvas = document.getElementById('canvas');
      return canvas;
    })()
  };
  function disableBrowserShortcuts(event) {
    if (event.key.startsWith('F') && Number(event.key.substring(1)) >= 1 && Number(event.key.substring(1)) <= 12) {
      event.preventDefault();
    }
  }

  const canvas = document.getElementById('canvas');
  canvas.addEventListener('pointerdown', function() {
    canvas.focus();
  });
  document.addEventListener('keydown', function(event) {
    if (document.activeElement === canvas) {
      disableBrowserShortcuts(event);
    }
  });
</script>
